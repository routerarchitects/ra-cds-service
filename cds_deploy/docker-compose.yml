services:
  postgres:
    image: postgres:16-alpine
    container_name: cds-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cds-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cds-keycloak
    command: ["start", "--features=dpop"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: ${KC_HOSTNAME:?set in .env}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "bash -ec \"{ printf 'HEAD /keycloak/health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200\\|HTTP/1.1 200'; } 0<>/dev/tcp/127.0.0.1/9000\""
        ]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 10s
    networks:
      - cds-net
    restart: unless-stopped

  cds-api:
    build:
      context: ../cds_service
      dockerfile: Dockerfile
    container_name: cds-api
    expose:
      - "8080"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?set in .env}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      AUTH_MODE: ${AUTH_MODE:-keycloak-dpop}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?set in .env}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?set in .env}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-cds-service}
      KEYCLOAK_REQUIRED_ROLE: ${KEYCLOAK_REQUIRED_ROLE:-cds-admin}
      KEYCLOAK_ADMIN_UI_CLIENT_ID: ${KEYCLOAK_ADMIN_UI_CLIENT_ID:-cds-admin-ui}
      KEYCLOAK_ACCESS_TOKEN_ALG: ${KEYCLOAK_ACCESS_TOKEN_ALG:-RS256}
      DPOP_REQUIRED: ${DPOP_REQUIRED:-true}
      DPOP_ALLOWED_ALGS: ${DPOP_ALLOWED_ALGS:-ES256}
      DPOP_JTI_CACHE_TTL_SECONDS: ${DPOP_JTI_CACHE_TTL_SECONDS:-300}
      DPOP_PROOF_MAX_AGE_SECONDS: ${DPOP_PROOF_MAX_AGE_SECONDS:-300}
      DPOP_CLOCK_SKEW_SECONDS: ${DPOP_CLOCK_SKEW_SECONDS:-30}
      JWKS_CACHE_TTL_SECONDS: ${JWKS_CACHE_TTL_SECONDS:-300}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set in .env}
      SSL_CERT_FILE: /etc/ssl/certs/admin-client-ca.pem
    volumes:
      - ./nginx/certs/admin-client-ca.pem:/etc/ssl/certs/admin-client-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cds-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: cds-nginx
    ports:
      - "4443:4443"
      - "5443:5443"
    volumes:
      - ../../mc-cds-ui/cds-admin-ui/dist:/usr/share/nginx/html:ro
      - ./nginx/certs/device-server-cert.pem:/etc/ssl/certs/device-server-cert.pem:ro
      - ./nginx/certs/device-server-key.pem:/etc/ssl/private/device-server-key.pem:ro
      - ./nginx/certs/admin-server-cert.pem:/etc/ssl/certs/admin-server-cert.pem:ro
      - ./nginx/certs/admin-server-key.pem:/etc/ssl/private/admin-server-key.pem:ro
      - ./nginx/certs/device-client-ca.pem:/etc/ssl/certs/device-client-ca.pem:ro
    depends_on:
      cds-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      cds-net:
        ipv4_address: 10.42.3.10
    restart: unless-stopped

networks:
  cds-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.3.0/24

volumes:
  postgres_data:
