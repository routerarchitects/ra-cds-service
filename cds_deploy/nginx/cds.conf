limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=keycloak:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=device_lookup:10m rate=20r/s;

server {
    listen 4443 ssl;
    server_name cds.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate        /etc/ssl/certs/device-server-cert.pem;
    ssl_certificate_key    /etc/ssl/private/device-server-key.pem;
    ssl_client_certificate /etc/ssl/certs/device-client-ca.pem;
    ssl_verify_client      on;

    location /v1/devices/ {
        limit_req zone=device_lookup burst=50 nodelay;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_pass http://cds-api:8080;
    }
}

server {
    listen 5443 ssl;
    server_name cds.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate        /etc/ssl/certs/admin-server-cert.pem;
    ssl_certificate_key    /etc/ssl/private/admin-server-key.pem;
    ssl_verify_client      off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    location /keycloak/ {
        limit_req zone=keycloak burst=50 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://keycloak:8080;
    }

    location = /v1/device {
        limit_req zone=admin_api burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header DPoP $http_dpop;
        proxy_pass http://cds-api:8080;
    }

    location ~ "^/v1/device/[0-9a-f]{2}(:[0-9a-f]{2}){5}$" {
        limit_req zone=admin_api burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header DPoP $http_dpop;
        proxy_pass http://cds-api:8080;
    }

    location ^~ /v1/devices/ {
        return 404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
