server {
    listen 4443 ssl;
    server_name cds.example.com;

    ssl_certificate        /etc/ssl/certs/device-server-cert.pem;
    ssl_certificate_key    /etc/ssl/private/device-server-key.pem;
    ssl_client_certificate /etc/ssl/certs/device-client-ca.pem;
    ssl_verify_client      on;

    location /v1/devices/ {
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_pass http://cds-api:8080;
    }
}

server {
    listen 5443 ssl;
    server_name cds.example.com;

    ssl_certificate        /etc/ssl/certs/admin-server-cert.pem;
    ssl_certificate_key    /etc/ssl/private/admin-server-key.pem;
    ssl_verify_client      off;

    root /usr/share/nginx/html;
    index index.html;

    location /keycloak/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://keycloak:8080;
    }

    location /v1/device {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header DPoP $http_dpop;
        proxy_pass http://cds-api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
